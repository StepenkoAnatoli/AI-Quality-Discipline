name: Phase 3 validation

on:
  push:
    branches:
      - "phase-3/**"
    paths:
      - ".gitattributes"
      - "scripts/install.py"
      - "tests/test_install.py"
      - "skills/**"
      - "scripts/validate_*.py"
      - "tests/test_validators.py"
      - "evaluations/**"
      - ".github/workflows/phase3-validation.yml"
  pull_request:
    paths:
      - ".gitattributes"
      - "scripts/install.py"
      - "tests/test_install.py"
      - "skills/**"
      - "scripts/validate_*.py"
      - "tests/test_validators.py"
      - "evaluations/**"
      - ".github/workflows/phase3-validation.yml"

permissions:
  contents: read

jobs:
  structural-and-fixture-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical skills
        run: python scripts/validate_skills.py
      - name: Test validators
        run: python -m unittest discover -s tests -p 'test_validators.py' -v
      - name: Check code fixture baseline outcomes
        run: python evaluations/fixtures/check_fixtures.py
      - name: Phase 3.2 allowlist, fixtures, harness and fail-closed scoring tests (no OpenCode, no network)
        run: |
          python evaluations/phase-3.2/harness/manifest.py check-sources --phase-root evaluations/phase-3.2
          python -m unittest discover -s evaluations/phase-3.2/tests -p "test_harness.py" -v
          python -m unittest discover -s evaluations/phase-3.2/tests -p "test_scoring.py" -v
          python -m unittest discover -s evaluations/phase-3.2/tests -p "test_difficulty.py" -v
          python -m unittest discover -s evaluations/phase-3.2/tests -p "test_cc_adapter.py" -v

  phase-3-2-scoring-sandbox:
    # Demonstrates the Docker isolation boundary used for hidden scoring. Fails
    # if the tests are skipped, because a skipped test demonstrates nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin the sandbox image by digest
        run: |
          docker pull python:3.12-slim
          echo "AQD_SANDBOX_IMAGE=$(docker inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)" >> "$GITHUB_ENV"
      - name: Sandbox isolation tests
        run: |
          python -m unittest discover -s evaluations/phase-3.2/tests -p "test_sandbox.py" -v 2>&1 | tee sandbox.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -q "skipped" sandbox.log

  native-claude-code-dry-run:
    # Phase 3.3: runs the REAL launch-run-cc.sh end to end against a MOCK claude with a SYNTHETIC token, inside a
    # disposable container with no network. No secret is referenced; nothing here can authenticate or reach a model.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Report whether an unprivileged user can create bubblewrap namespaces on this runner (as found)
        run: |
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo useradd -M -s /usr/sbin/nologin aqd-probe
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone 2>/dev/null || true
          if sudo -u aqd-probe env -i PATH=/usr/bin:/bin bwrap --ro-bind / / --unshare-user --unshare-pid --proc /proc true; then
            echo "runner host as found: bubblewrap namespaces WORK for an unprivileged user"
          else
            echo "runner host as found: bubblewrap namespaces REFUSED for an unprivileged user"
          fi
      - name: Allow unprivileged user namespaces on this disposable runner (logged host change)
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo -u aqd-probe env -i PATH=/usr/bin:/bin bwrap --ro-bind / / --unshare-user --unshare-pid --proc /proc true \
            && echo "runner host after the change: bubblewrap namespaces WORK"
      - name: Build the disposable dry-run image
        run: docker build -q -t aqd-dryrun -f evaluations/phase-3.3/dryrun/Dockerfile evaluations/phase-3.3/dryrun
      - name: Launcher dry run (mock CLI, synthetic token, no network)
        run: |
          out="$RUNNER_TEMP/aqd-dryrun"; mkdir -p "$out"
          docker run --rm --network none --privileged --hostname aqd --add-host aqd:127.0.0.1 \
            -v "$PWD:/src:ro" -v "$out:/out" aqd-dryrun bash /src/evaluations/phase-3.3/dryrun/dryrun-cc.sh
          docker run --rm --network none --hostname aqd --add-host aqd:127.0.0.1 -e DRYRUN_MODE=preflight-only \
            -v "$PWD:/src:ro" -v "$out:/out" aqd-dryrun bash /src/evaluations/phase-3.3/dryrun/dryrun-cc.sh
          python3 evaluations/phase-3.3/dryrun/check_results.py "$out"/dryrun-results-*.ndjson
      - name: Preflight logs (synthetic token only; never printed by the harness)
        if: always()
        run: grep -h -v 'unable to resolve host' "$RUNNER_TEMP"/aqd-dryrun/preflight-*.log 2>/dev/null | tail -n 40 || true

  installer-tests:
    # tests/test_install.py on Linux and Windows. Phase 3.2 risk R13: on Windows,
    # 9 of 14 failed because test fixtures were written with CRLF line endings.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Canonical SKILL.md files are checked out with LF
        shell: bash
        run: |
          for f in skills/*/SKILL.md; do
            if grep -q $'\r' "$f"; then echo "CRLF in $f"; exit 1; fi
          done
      - name: Installer tests
        run: python -m unittest discover -s tests -p "test_install.py" -v
